[project]
name = "uptime-checker"
version = "0.1.0"
description = "Check a list of URLs and report whether each site is up"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
uptime-checker = "uptime_checker:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
